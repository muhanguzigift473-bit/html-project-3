<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Instagram Web Clone</title>
    <!-- FontAwesome for Native-Looking Instagram Icons -->
    <link rel="stylesheet" href="https://cloudflare.com">
    <style>
    /* Modern System Typography & Variable Resets */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: #ffffff;
            color: #000000;
            display: flex;
        }

        /* 1. Left-Hand Sidebar Navigation (Desktop Classic) */
        .sidebar {
            width: 245px;
            height: 100vh;
            border-right: 1px solid #dbdbdb;
            position: fixed;
            left: 0;
            top: 0;
            padding: 24px 12px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            background: #ffffff;
            z-index: 10;
        }

        .sidebar-brand {
            font-size: 24px;
            font-weight: bold;
            padding: 12px 12px 36px 12px;
            cursor: pointer;
        }

        .sidebar-links {
            list-style: none;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 16px;
            padding: 12px;
            font-size: 16px;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s ease;
        }

        .nav-item:hover {
            background-color: #f2f2f2;
        }

        .nav-item i {
            font-size: 24px;
            width: 24px;
            text-align: center;
        }

        .nav-item.active {
            font-weight: 700;
        }

        .profile-pic-nav {
            width: 24px;
            height: 24px;
            border-radius: 50%;
            background: #dbdbdb;
        }

        /* 2. Main Content Wrapper Layout */
        .main-wrapper {
            margin-left: 245px;
            width: calc(100% - 245px);
            display: flex;
            justify-content: center;
            min-height: 100vh;
            padding-top: 30px;
        }

        .content-container {
            max-width: 935px;
            width: 100%;
            display: flex;
            gap: 64px;
            padding: 0 20px;
        }

        /* 3. Central Timeline Feed Section */
        .feed-section {
            width: 100%;
            max-width: 470px;
        }

        /* Horizontal Stories Component */
        .stories-container {
            display: flex;
            gap: 16px;
            overflow-x: auto;
            padding: 8px 0 20px 0;
            margin-bottom: 10px;
        }

        .stories-container::-webkit-scrollbar {
            display: none; /* Hide default scrollbar tracks */
        }

        .story-item {
            display: flex;
            flex-direction: column;
            align-items: center;
            font-size: 12px;
            min-width: 66px;
            cursor: pointer;
        }

        .story-ring {
            width: 56px;
            height: 56px;
            border-radius: 50%;
            background: linear-gradient(45deg, #f09433 0%, #e6683c 25%, #dc2743 50%, #cc2366 75%, #bc1888 100%);
            padding: 2px;
            margin-bottom: 6px;
        }

        .story-img-inside {
            width: 100%;
            height: 100%;
            border-radius: 50%;
            background-color: #fafafa;
            border: 2px solid #ffffff;
        }

        .story-username {
            max-width: 66px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            color: #737373;
        }

        /* Card Post Component */
        .post-card {
            width: 100%;
            border-bottom: 1px solid #dbdbdb;
            margin-bottom: 20px;
            padding-bottom: 20px;
        }

        .post-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 12px 0;
        }

        .user-meta {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .user-avatar {
            width: 32px;
            height: 32px;
            border-radius: 50%;
            background: #dbdbdb;
        }

        .username {
            font-weight: 600;
            font-size: 14px;
            cursor: pointer;
        }

        .username:hover {
            color: #737373;
        }

        .post-header i {
            cursor: pointer;
            color: #262626;
        }

        .post-media-box {
            width: 100%;
            border-radius: 4px;
            overflow: hidden;
            border: 1px solid #efefef;
        }

        .post-media-box img {
            width: 100%;
            height: auto;
            display: block;
        }

        .post-actions-tray {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            font-size: 24px;
        }

        .left-tray {
            display: flex;
            gap: 16px;
        }

        .post-actions-tray i {
            cursor: pointer;
            transition: color 0.1s ease;
        }

        .post-actions-tray i:hover {
            color: #737373;
        }

        .post-body-info {
            font-size: 14px;
            display: flex;
            flex-direction: column;
            gap: 6px;
        }

        .likes-bold {
            font-weight: 600;
        }

        .caption-text span {
            font-weight: 600;
            margin-right: 4px;
        }

        .sub-grey-text {
            color: #737373;
            cursor: pointer;
        }

        .time-ago {
            font-size: 12px;
            color: #737373;
            text-transform: uppercase;
        }

        .inline-comment-input {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 12px;
        }

        .inline-comment-input input {
            border: none;
            outline: none;
            width: 85%;
            font-size: 14px;
        }

        .comment-submit-btn {
            color: #0095f6;
            font-weight: 600;
            background: none;
            border: none;
            cursor: pointer;
        }

        /* 4. Right-Hand Sidebar Suggestions Section */
        .suggestions-section {
            width: 320px;
            padding-top: 16px;
        }

        .widget-profile-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .widget-profile-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .widget-avatar {
            width: 44px;
            height: 44px;
            border-radius: 50%;
            background: #dbdbdb;
        }

        .widget-avatar.small {
            width: 32px;
            height: 32px;
        }

        .text-names {
            display: flex;
            flex-direction: column;
        }

        .handle-name {
            font-size: 14px;
            font-weight: 600;
        }

        .sub-name {
            font-size: 14px;
            color: #737373;
        }

        .blue-action-btn {
            color: #0095f6;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            border: none;
            background: none;
        }

        .suggestions-header {
            display: flex;
            justify-content: space-between;
            margin-bottom: 16px;
        }

        .suggestions-header span {
            font-size: 14px;
            font-weight: 600;
            color: #737373;
        }

        .suggestions-header button {
            color: #000000;
            font-weight: 600;
            font-size: 12px;
            border: none;
            background: none;
            cursor: pointer;
        }

        /* 5. Fluid Responsive Viewports Layout */
        @media (max-width: 1160px) {
            .suggestions-section {
                display: none; /* Hide right bar on narrower viewports */
            }
        }

        @media (max-width: 768px) {
            .sidebar {
                width: 72px; /* Contract menu bar options on tablet viewports */
                padding: 24px 0;
                align-items: center;
            }
            .sidebar-brand {
                display: none;
            }
            .nav-text {
                display: none;
            }
            .main-wrapper {
                margin-left: 72px;
                width: calc(100% - 72px);
            }
        }
    </style>

</head>
<body>
    <!-- 1. Left-Hand Fixed Sidebar Navigation -->
    <aside class="sidebar">
        <div>
            <div class="sidebar-brand">Instagram</div>
            <ul class="sidebar-links">
                <li class="nav-item active"><i class="fa-solid fa-house"></i><span class="nav-text">Home</span></li>
                <li class="nav-item"><i class="fa-solid fa-magnifying-glass"></i><span class="nav-text">Search</span></li>
                <li class="nav-item"><i class="fa-regular fa-compass"></i><span class="nav-text">Explore</span></li>
                <li class="nav-item"><i class="fa-solid fa-clapperboard"></i><span class="nav-text">Reels</span></li>
                <li class="nav-item"><i class="fa-regular fa-paper-plane"></i><span class="nav-text">Messages</span></li>
</div>
</body>
</html>
